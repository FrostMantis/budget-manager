{% extends "layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>New Bucket / Spending Category</h5>
                <form action="/create-bucket" method="POST">
                    <div class="mb-3"><label>Name</label><input type="text" name="name" class="form-control" placeholder="e.g. Groceries" required></div>
                    <div class="mb-3">
                        <label>Type</label>
                        <select name="type" class="form-select">
                            <option value="standard">Standard Spending</option>
                            <option value="goal">Financial Goal</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead><tr><th>Name</th><th>Type</th><th>Current Balance (€)</th><th>Action</th></tr></thead>
                    <tbody>
                        {% for b in buckets %}
                        <tr>
                            <td>{{ b.name }}</td>
                            <td><span class="badge bg-secondary">{{ b.bucket_type }}</span></td>
                            <td>
                                <form action="/update-balance/{{ b.id }}" method="POST" class="d-flex gap-2">
                                    <input type="number" step="0.01" name="balance" class="form-control form-control-sm w-50" value="{{ b.balance }}">
                                    <button type="submit" class="btn btn-sm btn-outline-success">Set</button>
                                </form>
                            </td>
                            <td>
                                {% if b.bucket_type not in ['savings', 'everything'] %}
                                <a href="/delete-bucket/{{ b.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this bucket?')">Delete</a>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
